[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-of-leith-flood-hydrology"
version = "0.1.0"
description = "Observed flood hydrology and frequency analysis for the Water of Leith at Murrayfield"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
rainfall = ["xarray>=2024.1", "zarr<3", "s3fs>=2024.2", "dask>=2024.2", "geopandas>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
